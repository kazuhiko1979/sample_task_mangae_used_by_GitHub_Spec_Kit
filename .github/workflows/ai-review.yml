name: AI review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Verify platform
        run: bash review/scripts/verify-platform.sh

  primary-review:
    name: primary-review
    if: vars.AI_REVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    needs: deterministic
    runs-on: [self-hosted, linux, ai-review]
    env:
      AI_REVIEW_PRIMARY: ${{ vars.AI_REVIEW_PRIMARY || 'codex' }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Fetch PR commit as data
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"
      - name: Run primary CLI review
        run: |
          mkdir -p review-results
          bash review/scripts/run-review.sh \
            --cli "$AI_REVIEW_PRIMARY" \
            --mode primary \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --output "review-results/primary-${AI_REVIEW_PRIMARY}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: primary-review
          path: review-results/primary-*.json

  deep-review:
    name: deep-review-${{ matrix.cli }}
    if: vars.AI_REVIEW_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    needs: deterministic
    runs-on: [self-hosted, linux, ai-review]
    env:
      # The runner checks out the trusted base commit and passes the PR head
      # only as diff data. Allow Gemini's non-interactive reviewer to use that
      # controlled workspace without an interactive trust prompt.
      GEMINI_CLI_TRUST_WORKSPACE: true
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
    strategy:
      fail-fast: false
      matrix:
        cli: [claude, gemini, codex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Fetch PR commit as data
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"
      - name: Run deep CLI review
        run: |
          mkdir -p review-results
          bash review/scripts/run-review.sh \
            --cli "${{ matrix.cli }}" \
            --mode deep \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --output "review-results/deep-${{ matrix.cli }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deep-review-${{ matrix.cli }}
          path: review-results/deep-${{ matrix.cli }}.json

  review-gate:
    name: review-gate
    if: always()
    needs: [deterministic, primary-review, deep-review]
    runs-on: ubuntu-latest
    env:
      AI_REVIEW_PRIMARY: ${{ vars.AI_REVIEW_PRIMARY || 'codex' }}
      AI_REVIEW_ENABLED: ${{ vars.AI_REVIEW_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: review-results
      - name: Aggregate review results
        continue-on-error: true
        run: |
          if [ "$AI_REVIEW_ENABLED" != "true" ]; then
            echo '{"schema_version":1,"status":"pass","reviewers":[],"blocking_findings":[],"missing_reviewers":[],"summary":"AI CLI review is disabled; deterministic checks completed."}' > review-gate.json
            exit 0
          fi
          mapfile -t results < <(find review-results -type f -name '*.json' -print)
          if [ "${#results[@]}" -eq 0 ]; then
            echo '{"schema_version":1,"status":"fail","reviewers":[],"blocking_findings":[],"summary":"no review results"}' > review-gate.json
            exit 1
          fi
          node review/scripts/aggregate.mjs \
            --output review-gate.json \
            --require "${AI_REVIEW_PRIMARY:-codex}:primary" \
            --require claude:deep \
            --require gemini:deep \
            --require codex:deep \
            "${results[@]}"
      - name: Render PR comment
        if: always()
        run: node review/scripts/render-comment.mjs review-gate.json review-comment.md
      - name: Comment on PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file review-comment.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: review-gate
          path: |
            review-gate.json
            review-comment.md
      - name: Enforce review gate
        run: node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('review-gate.json')); if(x.status !== 'pass') process.exit(1)"
