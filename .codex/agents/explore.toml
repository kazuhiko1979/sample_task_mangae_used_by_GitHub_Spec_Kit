- 大規模探索、複数の独立した調査スレッド
- 「どこで何が定義されているか」「全体構造」の把握

## 制約
- 変更・書き込みは禁止（read-only）
- 完全なコンテキストを毎回渡す（ステートレス前提）

## 出力形式
